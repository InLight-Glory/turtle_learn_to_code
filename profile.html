<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Coding Champions</title>
    <link rel="stylesheet" href="style.css">
    <link id="theme-stylesheet" rel="stylesheet" href="styles/theme-default.css">
</head>
<body>
    <header>
        <div class="container header-bar">
            <div class="brand">
                <h1>Coding Champions</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="challenge.html">Challenges</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
            <div class="header-status">
                <a class="profile-chip" href="profile.html" aria-label="Open profile">
                    <span class="profile-chip-avatar" id="header-avatar">🐢</span>
                    <span class="profile-chip-points"><span id="header-points">0</span> pts</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <section>
                <h2>Your Profile</h2>
                <p>This profile is saved on this device (no login needed).</p>

                <div style="display:grid; grid-template-columns: 1fr; gap: 18px; margin-top: 18px;">
                    <div class="avatar-preview">
                        <div class="avatar-figure" aria-label="Avatar preview">
                            <div class="avatar-layer background" id="avatar-bg">⬜</div>
                            <div class="avatar-layer hat" id="avatar-hat">➖</div>
                            <div class="avatar-layer base" id="avatar-base">🐢</div>
                            <div class="avatar-layer shell" id="avatar-shell">🟩</div>
                        </div>
                    </div>

                    <div class="panel" style="box-shadow:none; border: 1px solid var(--light-gray);">
                        <h3 style="margin-bottom: 10px;">Details</h3>
                        <label for="profile-name" style="display:block; margin-bottom:6px; font-weight:bold;">Display name</label>
                        <input id="profile-name" type="text" maxlength="24" placeholder="Coder Turtle" style="width:100%; padding:10px; border-radius:6px; border: 1px solid var(--light-gray);">
                        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
                            <button class="button" id="save-profile-btn" type="button">Save</button>
                            <a class="button button-secondary" href="shop.html">Go to Shop</a>
                        </div>
                    </div>

                    <div class="panel" style="box-shadow:none; border: 1px solid var(--light-gray);">
                        <h3 style="margin-bottom: 10px;">Equipment</h3>
                        <div style="display:grid; grid-template-columns: 1fr; gap: 12px;">
                            <label>Background
                                <select id="equip-background" style="width:100%; padding:10px; border-radius:6px; border: 1px solid var(--light-gray);"></select>
                            </label>
                            <label>Hat
                                <select id="equip-hat" style="width:100%; padding:10px; border-radius:6px; border: 1px solid var(--light-gray);"></select>
                            </label>
                            <label>Shell
                                <select id="equip-shell" style="width:100%; padding:10px; border-radius:6px; border: 1px solid var(--light-gray);"></select>
                            </label>
                        </div>
                        <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                            <button class="button" id="save-equipment-btn" type="button">Equip</button>
                            <button class="button button-secondary" id="reset-progress-btn" type="button">Reset Progress</button>
                        </div>
                        <div id="profile-message" style="margin-top:12px; display:none;"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Coding Champions</p>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
