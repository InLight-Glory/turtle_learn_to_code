<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Coding Champions</title>
    <link rel="stylesheet" href="style.css">
    <link id="theme-stylesheet" rel="stylesheet" href="styles/theme-default.css">
</head>
<body>
    <header>
        <div class="container header-bar">
            <div class="brand">
                <h1>Coding Champions</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="challenge.html">Challenges</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
            <div class="header-status">
                <a class="profile-chip" href="profile.html" aria-label="Open profile">
                    <span class="profile-chip-avatar" id="header-avatar">🐢</span>
                    <span class="profile-chip-points"><span id="header-points">0</span> pts</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <section>
                <h2>Shop</h2>
                <p>Spend points to decorate your avatar. Earn points by completing challenges and finishing projects.</p>
                <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px;">
                    <span class="pill" aria-label="Current points balance">Balance: <strong><span id="shop-balance">0</span></strong> pts</span>
                    <label class="pill" for="shop-filter">
                        Filter:
                        <select id="shop-filter">
                            <option value="all">All</option>
                            <option value="background">Background</option>
                            <option value="hat">Hat</option>
                            <option value="shell">Shell</option>
                        </select>
                    </label>
                </div>
                <div id="shop-message" style="margin-top:12px; display:none;"></div>
                <div class="card-grid" id="shop-list" style="margin-top:16px;"></div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Coding Champions</p>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
