<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge - Coding Champions</title>
    <link rel="stylesheet" href="style.css">
    <link id="theme-stylesheet" rel="stylesheet" href="styles/theme-default.css">
</head>
<body>
    <header>
        <div class="container header-bar">
            <div class="brand">
                <h1>Coding Champions</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="challenge.html">Challenges</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
            <div class="header-status">
                <a class="profile-chip" href="profile.html" aria-label="Open profile">
                    <span class="profile-chip-avatar" id="header-avatar">🐢</span>
                    <span class="profile-chip-points"><span id="header-points">0</span> pts</span>
                </a>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="project-banner" id="project-banner" style="display: none;">
                <div class="project-banner-main">
                    <div class="project-banner-title" id="project-banner-title"></div>
                    <div class="project-banner-sub" id="project-banner-sub"></div>
                </div>
                <div class="project-banner-actions">
                    <a class="button button-secondary" id="project-back-btn" href="projects.html">Back</a>
                </div>
            </div>
            <div class="challenge-header">
                <h2 id="challenge-title">Challenge Title</h2>
                <div class="layout-controls">
                    <label for="layout-select">Layout:</label>
                    <select id="layout-select">
                        <!-- Options will be populated by JS -->
                    </select>
                </div>
            </div>
    <div id="win-modal">
        <div class="modal-content">
            <h2>Success!</h2>
            <p>You completed the challenge!</p>
            <p id="win-reward-text" style="margin-top:-6px; font-weight:bold;"></p>
            <div class="modal-actions">
                <button class="modal-btn" id="close-modal-btn">Awesome!</button>
                <a class="modal-btn button-secondary" id="next-step-btn" href="#" style="display:none;">Next Step</a>
            </div>
        </div>
    </div>
            <div class="challenge-layout">
                <div class="challenge-instructions panel">
                    <h3>Instructions</h3>
                    <p id="challenge-instructions">Challenge instructions will be loaded here.</p>
                </div>
                <div class="code-editor-container panel">
                    <h3>Your Code</h3>
                    <div id="error-message" style="display: none;"></div>
                    <textarea id="code-editor" rows="10"></textarea>
                    <button class="button" id="run-code-btn">Run Code</button>
                </div>
                <div class="visualization-container panel">
                    <h3>Visualization</h3>
                    <div id="canvas-wrapper">
                        <canvas id="turtle-canvas" width="400" height="400"></canvas>
                        <div id="turtle-icon">🐢</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Coding Champions</p>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
